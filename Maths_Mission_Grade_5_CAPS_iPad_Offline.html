const topics=[
{id:'whole',icon:'🔢',name:'Whole numbers',group:'Numbers',summary:'Place value, ordering, rounding, expanded notation and factors.',intro:'Large numbers are easier when you look at one digit and one place at a time.',steps:['Digits have different values depending on their position: hundreds, thousands and beyond.','To compare numbers, begin with the leftmost digit.','To round, look at the digit immediately to the right of the place you are rounding to.','Revise even and odd numbers, multiples, factors and counting sequences.'],example:['Write 506 304 in expanded notation.','500 000 + 6 000 + 300 + 4','The zero positions have no value to add.'],lab:'place'},
{id:'sentences',icon:'🧩',name:'Number sentences',group:'Numbers',summary:'Find unknown values and check equations.',intro:'A number sentence is an equation. Both sides of an equals sign must balance.',steps:['A box, letter or blank can stand for a missing number.','Use the inverse operation to find a missing value: undo addition with subtraction, and multiplication with division.','Check the answer by substituting it into the original equation.','Use brackets and the correct order of operations when needed.'],example:['□ + 368 = 900','900 − 368 = 532, so □ = 532','Check: 532 + 368 = 900.'],lab:'pattern'},
{id:'addition',icon:'➕',name:'Addition and subtraction',group:'Numbers',summary:'Mental maths, columns, estimation and word problems.',intro:'Place value keeps large-number calculations neat and correct.',steps:['Line up digits by their place value before adding or subtracting.','Regroup or borrow carefully when crossing a ten, hundred or thousand.','Estimate first to see whether your answer makes sense.','Check subtraction by adding the difference back to the smaller number.'],example:['27 458 + 13 765','27 458 + 13 765 = 41 223','Estimate: 27 000 + 14 000 ≈ 41 000.'],lab:'place'},
{id:'multiply',icon:'✖️',name:'Multiplication and division',group:'Numbers',summary:'Times tables, long calculations, remainders and problems.',intro:'Multiplication makes equal groups; division shares or groups them.',steps:['Keep your multiplication tables up to 12 × 12 sharp.','Break large numbers into useful parts using place value.','In division, interpret a remainder using the story.','Use multiplication to check a division answer.'],example:['144 ÷ 12','144 ÷ 12 = 12','Check: 12 × 12 = 144.'],lab:'area'},
{id:'fractions',icon:'🍕',name:'Common fractions',group:'Numbers',summary:'Equivalent fractions, comparison, fractions of quantities and addition.',intro:'Fractions tell us how many equal parts of a whole we have.',steps:['The denominator tells how many equal parts make the whole.','The numerator tells how many of those parts are used.','Equivalent fractions name the same amount, such as 1/2 and 2/4.','For addition/subtraction with like denominators, keep the denominator and work with the numerators.','To find a fraction of a quantity, divide by the denominator, then multiply by the numerator.'],example:['Find 3/4 of 28','28 ÷ 4 × 3 = 21','Three groups of 7 make 21.'],lab:'fraction'},
{id:'patterns',icon:'🔁',name:'Geometric and numeric patterns',group:'Patterns',summary:'Describe, extend and find rules for patterns.',intro:'Look for a repeating or growing rule before trying to predict what comes next.',steps:['In a numeric sequence, compare neighbouring terms to find the change.','A pattern can add, subtract, multiply or divide by a constant rule.','In a geometric pattern, count shapes, blocks, rows or turns.','Use a table to connect a term number to a number of objects.'],example:['12, 18, 24, 30, ...','Add 6 each time → 36, 42','Say the rule as well as the next number.'],lab:'pattern'},
{id:'shapes',icon:'🔷',name:'Properties of 2D shapes and 3D objects',group:'Geometry',summary:'Sides, angles, faces, edges, vertices and nets.',intro:'Flat shapes are 2D; objects that take up space are 3D.',steps:['Describe 2D shapes by the number of sides, corners, angles and symmetry.','A regular polygon has equal sides and equal angles.','A 3D object can have flat faces or curved surfaces.','A net is a flat arrangement that folds to make a 3D object.','Compare prisms, pyramids, cylinders, cones and spheres.'],example:['How many faces does a cube have?','6 square faces','A cube also has 12 edges and 8 vertices.'],lab:'shape'},
{id:'transform',icon:'🪞',name:'Transformations',group:'Geometry',summary:'Slides, reflections, rotations and symmetry.',intro:'Transformations move or flip shapes while keeping their size the same.',steps:['A translation slides an object without turning it.','A reflection flips a figure across a mirror line.','A rotation turns a figure around a fixed point.','Find lines of symmetry by imagining a fold that makes two matching halves.'],example:['Move a shape 3 squares right, 2 up.','This is a translation.','Try the shape-mover lab and watch the coordinates.'],lab:'move'},
{id:'data',icon:'📊',name:'Data handling',group:'Data',summary:'Tally charts, tables, bar graphs and interpreting data.',intro:'Collecting and showing information is only the start — you must interpret it.',steps:['Read the title, labels and scale before interpreting a graph.','Tally marks can be grouped in fives to count quickly.','Bar graphs compare amounts in categories.','Answer questions about totals, differences, most and least, and the range.','Extra textbook challenge: use words such as certain, likely, unlikely and impossible for chance.'],example:['Red = 8, Blue = 12, Green = 5 votes','Total = 8 + 12 + 5 = 25','Blue has 4 more votes than red.'],lab:'data'},
{id:'length',icon:'📏',name:'Length',group:'Measurement',summary:'Measure, estimate and convert mm, cm, m and km.',intro:'Choose the unit that fits the object, then convert carefully.',steps:['10 millimetres = 1 centimetre.','100 centimetres = 1 metre.','1 000 metres = 1 kilometre.','Multiply when converting to smaller units; divide when converting to bigger units.','Read a ruler from the zero mark.'],example:['Convert 3.7 km to metres.','3.7 × 1 000 = 3 700 m','Use a decimal comma or point — both mean the same value.'],lab:'convert'},
{id:'area',icon:'🧱',name:'Perimeter, area and volume',group:'Measurement',summary:'Measure around, count square units and count cubes.',intro:'Perimeter, area and volume are three different measurements.',steps:['Perimeter is the distance around a 2D shape: add its side lengths.','Area is surface covered by square units: length × width for a rectangle.','Volume measures space occupied: count unit cubes or layers.','Always write the correct unit: cm, cm² or cm³.'],example:['Rectangle: 8 cm by 5 cm','Perimeter = 26 cm; area = 40 cm²','8 + 5 + 8 + 5 = 26; 8 × 5 = 40.'],lab:'area'},
{id:'time',icon:'🕒',name:'Time',group:'Measurement',summary:'Analogue clocks, 12/24-hour time and elapsed time.',intro:'Use a number line or count in chunks to calculate time intervals.',steps:['One hour is 60 minutes; one day is 24 hours.','In 24-hour time, 7:15 pm becomes 19:15.','When calculating duration, count to the next full hour and then onwards.','Be careful when crossing midday or midnight.'],example:['A bus leaves at 08:45 and arrives at 11:20.','15 min + 2 h + 20 min = 2 h 35 min','Count 08:45 → 09:00 → 11:00 → 11:20.'],lab:'clock'},
{id:'capacity',icon:'🧪',name:'Capacity and volume',group:'Measurement',summary:'Litres, millilitres and the space inside containers.',intro:'Capacity tells us how much a container can hold.',steps:['1 litre = 1 000 millilitres.','Use litres for larger amounts and millilitres for small amounts.','Read a measuring jug scale between labelled intervals.','Volume of solid objects can be counted in cubic units.','Do not confuse capacity (mℓ or ℓ) with solid volume (cm³).'],example:['Convert 2.5 litres into millilitres.','2.5 × 1 000 = 2 500 mℓ','Two litres plus half a litre.'],lab:'convert'},
{id:'mass',icon:'⚖️',name:'Mass',group:'Measurement',summary:'Grams, kilograms, tonnes and scales.',intro:'Mass tells us how heavy an object is. Use sensible units.',steps:['1 kilogram = 1 000 grams.','1 tonne = 1 000 kilograms.','Convert to the same unit before adding or comparing masses.','Read the marked divisions on a scale.'],example:['Convert 2 450 grams into kilograms.','2 450 ÷ 1 000 = 2.45 kg','That is 2 kg and 450 g.'],lab:'convert'}
];

function labLabel(id){return({place:'Place-value machine',fraction:'Fraction studio',pattern:'Pattern machine',shape:'Shape explorer',move:'Transformation trail',area:'Area & perimeter builder',clock:'Clock lab',data:'Data detectives',convert:'Unit converter'})[id]||'Maths lab'}
const labs=[['place','🔢','Place-value machine','Change a large number and see every digit’s value.'],['fraction','🍕','Fraction studio','Colour equal parts and see equivalent fractions.'],['pattern','🔁','Pattern machine','Experiment with growing number patterns.'],['shape','🔷','Shape explorer','Investigate polygons and solid shapes.'],['move','🪞','Transformation trail','Slide, turn and reflect a shape on a grid.'],['area','🧱','Area & perimeter builder','Adjust length and width; see square units.'],['clock','🕒','Clock lab','Move the hands and calculate elapsed time.'],['data','📊','Data detectives','Read and compare an interactive class graph.'],['convert','📏','Unit converter','Change between length, capacity and mass units.']];
function labsPage(){return`<div class="section-head"><div><span class="eyebrow">Touch, change and discover</span><h2>🔬 Interactive maths labs</h2><p>Real controls, diagrams and immediate visual results. Great for learning the 'why' behind each method.</p></div></div><div class="filterbar">${labs.map(([id,icon,label])=>`<button class="${labId===id?'active':''}" onclick="labId='${id}';render()">${icon} ${label}</button>`).join('')}</div><div class="card lab-panel"><span class="tag orange">Experiment zone</span><h2 style="margin:8px 0">${labLabel(labId)}</h2><div id="labBody"></div></div>`}
function labHtml(){const s=labState;const control=(title,id,min,max,val,step=1)=>`<div class="control"><label for="${id}">${title}: <b id="${id}v">${val}</b></label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}" oninput="setLab('${id}',this.value)"></div>`;
if(labId==='place')return `<p>Type a number between 0 and 999 999. Watch its expanded notation build.</p><div class="control"><label>Whole number</label><input id="placeNum" class="field number" type="number" min="0" max="999999" value="${s.place}" oninput="setLab('place',this.value)"></div><div class="visual" id="labVisual"></div>`;
if(labId==='fraction')return `<p>All parts must be equal. Slide the controls to colour the numerator.</p><div class="grid2">${control('Denominator','fracD',2,12,s.fracD)}${control('Numerator','fracN',0,s.fracD,s.fracN)}</div><div class="visual" id="labVisual"></div>`;
if(labId==='pattern')return `<p>What happens when you change the starting number or the rule?</p><div class="grid2"><div class="control"><label>Starting number</label><input class="field" type="number" value="${s.patternStart}" oninput="setLab('patternStart',this.value)"></div><div class="control"><label>Add this amount every step</label><input class="field" type="number" value="${s.patternStep}" oninput="setLab('patternStep',this.value)"></div></div><div class="visual" id="labVisual"></div>`;
if(labId==='area')return `<p>Count the coloured squares. Perimeter goes around the outside; area fills the inside.</p><div class="grid2">${control('Length (columns)','areaC',1,12,s.areaC)}${control('Width (rows)','areaR',1,10,s.areaR)}</div><div class="visual" id="labVisual"></div>`;
if(labId==='clock')return `<p>Set the clock and add minutes to find a finishing time. Watch both clock hands.</p><div class="grid3">${control('Hour (24-hour)','clockH',0,23,s.clockH)}${control('Minutes','clockM',0,55,s.clockM,5)}${control('Minutes later','clockPlus',0,240,s.clockPlus,5)}</div><div class="visual" id="labVisual"></div>`;
if(labId==='convert')return `<p>Choose the starting unit and target unit. Conversions are shown with a live example.</p><div class="grid3"><div class="control"><label>Amount</label><input class="field" type="number" step="any" value="${s.convValue}" oninput="setLab('convValue',this.value)"></div><div class="control"><label>From</label><select id="convFrom" onchange="setLab('convFrom',this.value)">${Object.keys(conversion).map(x=>`<option ${s.convFrom===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="control"><label>To</label><select id="convTo" onchange="setLab('convTo',this.value)">${Object.keys(conversion).map(x=>`<option ${s.convTo===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="visual" id="labVisual"></div>`;
if(labId==='shape')return `<p>Tap a shape to see its name and properties.</p><div class="shape-grid">${[['triangle','Triangle'],['square','Square'],['hexagon','Hexagon'],['circle','Circle'],['cube','Cube'],['cylinder','Cylinder']].map(([id,label])=>`<button class="shape-option ${s.shape===id?'active':''}" onclick="setLab('shape','${id}')">${shapeSVG(id)}${label}</button>`).join('')}</div><div class="visual" id="labVisual"></div>`;
if(labId==='data')return `<p>These are example votes for favourite sports. Touch any bar for its value.</p><div class="visual" id="labVisual"></div>`;
if(labId==='move')return `<p>Watch the blue triangle slide, flip and turn on the grid. Each move keeps its size unchanged.</p><div class="row" style="margin-top:12px"><button class="btn soft sm" onclick="moveLab(-1,0)">← Left</button><button class="btn soft sm" onclick="moveLab(1,0)">Right →</button><button class="btn soft sm" onclick="moveLab(0,-1)">↑ Up</button><button class="btn soft sm" onclick="moveLab(0,1)">↓ Down</button><button class="btn ghost sm" onclick="moveLab('rotate')">↻ Rotate 90°</button><button class="btn ghost sm" onclick="moveLab('mirror')">🪞 Reflect</button><button class="btn ghost sm" onclick="moveLab('reset')">Reset</button></div><div class="visual" id="labVisual"></div>`;
return ''}
const conversion={mm:{k:'length',n:0.001},cm:{k:'length',n:0.01},m:{k:'length',n:1},km:{k:'length',n:1000},'mℓ':{k:'capacity',n:0.001},'ℓ':{k:'capacity',n:1},g:{k:'mass',n:0.001},kg:{k:'mass',n:1},t:{k:'mass',n:1000}};
function labsControls(){const el=$('labBody');if(el)el.innerHTML=labHtml()}
function setLab(k,v){if(k==='fracD'){labState.fracD=+v;labState.fracN=Math.min(labState.fracN,labState.fracD);labsControls()}else if(k==='shape'||k==='convFrom'||k==='convTo'){labState[k]=v;if(k==='shape')labsControls()}else {labState[k]=Number(v)||0}drawLab();const tag=$(k+'v');if(tag)tag.textContent=labState[k]}
function gcd(a,b){while(b){[a,b]=[b,a%b]}return a||1}
function shapeSVG(s){const base='viewBox="0 0 130 90" role="img" aria-label="'+s+'"';const stroke='stroke="#18495b" stroke-width="3" fill="#8bd5bd"';const pics={triangle:`<polygon points="65,7 115,83 15,83" ${stroke}/>`,square:`<rect x="27" y="11" width="76" height="68" ${stroke}/>`,hexagon:`<polygon points="40,8 90,8 120,45 90,82 40,82 10,45" ${stroke}/>`,circle:`<circle cx="65" cy="45" r="37" ${stroke}/>`,cube:`<polygon points="27,28 68,11 107,32 68,50" ${stroke}/><path d="M27 28v42l41 15V50 M107 32v42L68 85" fill="none" stroke="#18495b" stroke-width="3"/>`,cylinder:`<rect x="27" y="28" width="76" height="46" fill="#8bd5bd"/><ellipse cx="65" cy="28" rx="38" ry="15" ${stroke}/><path d="M27 28v44a38 15 0 0 0 76 0V28" fill="none" stroke="#18495b" stroke-width="3"/>`};return `<svg ${base}>${pics[s]}</svg>`}
function moveLab(a,b){const s=labState;if(a==='rotate')s.moveAngle=(s.moveAngle+90)%360;else if(a==='mirror')s.moveMirror=!s.moveMirror;else if(a==='reset')Object.assign(s,{moveX:2,moveY:3,moveAngle:0,moveMirror:false});else{s.moveX=Math.max(1,Math.min(8,s.moveX+a));s.moveY=Math.max(1,Math.min(6,s.moveY+b))}drawLab()}
function drawLab(){const root=$('labBody');if(!root)return;if(!$('labVisual'))labsControls();const dst=$('labVisual');if(!dst)return;const s=labState;let out='';if(labId==='place'){const n=Math.max(0,Math.floor(s.place));const places=['hundred thousands','ten thousands','thousands','hundreds','tens','ones'];const ds=String(n).padStart(6,'0').split('').map(Number);out=`<h3>${fmt(n)}</h3><div class="grid3" style="margin-top:14px">${ds.map((d,i)=>`<div class="tip green"><b>${d}</b><div class="small">${places[i]}</div><div class="strong">Value: ${fmt(d*10**(5-i))}</div></div>`).join('')}</div><p class="strong" style="margin-top:13px">Expanded: ${ds.map((d,i)=>d*10**(5-i)).filter(Boolean).map(fmt).join(' + ')||'0'}</p>`}
if(labId==='fraction'){const g=gcd(s.fracN,s.fracD);out=`<div class="big-result">${s.fracN}/${s.fracD} ${s.fracN?s.fracN===s.fracD?'= 1 whole':'= '+(s.fracN/g)+'/'+(s.fracD/g)+' in simplest form':'= 0'}</div><div class="fractionbar" aria-label="${s.fracN} of ${s.fracD} equal parts filled">${Array.from({length:s.fracD},(_,i)=>`<span class="${i<s.fracN?'filled':''}"></span>`).join('')}</div><p style="margin-top:15px">Each part is <b>1/${s.fracD}</b> of the whole. ${s.fracN} coloured part(s) make <b>${Math.round(s.fracN/s.fracD*100)}%</b>.</p>`}
if(labId==='pattern'){out=`<div class="numberline">${Array.from({length:8},(_,i)=>`<span class="numchip">${fmt(s.patternStart+i*s.patternStep)}</span>${i<7?'<b>→</b>':''}`).join('')}</div><p style="margin-top:16px">Rule: <b>add ${fmt(s.patternStep)}</b> each time. Term 10: <b>${fmt(s.patternStart+9*s.patternStep)}</b>.</p>`}
if(labId==='area'){out=`<div class="gridpaper" style="--c:${s.areaC}">${Array.from({length:s.areaC*s.areaR},()=>'<span></span>').join('')}</div><div class="row" style="margin-top:16px"><span class="tag">${s.areaC} by ${s.areaR} units</span><b>Area = ${s.areaC*s.areaR} square units</b><b>Perimeter = ${2*(s.areaC+s.areaR)} units</b></div><p class="small muted" style="margin-top:10px">Volume is different: a solid with ${s.areaC*s.areaR} cubes on each layer and 3 layers would have ${s.areaC*s.areaR*3} cubic units.</p>`}
if(labId==='clock'){const h=s.clockH%12,m=s.clockM,finish=(s.clockH*60+m+s.clockPlus)%(24*60);const clockFormat=x=>String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0');const hh=(h+m/60)*30,mm=m*6;out=`<div class="grid2" style="align-items:center"><svg viewBox="0 0 250 250" style="max-width:270px" role="img" aria-label="Analogue clock shows ${clockFormat(s.clockH*60+m)}"><circle cx="125" cy="125" r="113" fill="#fff" stroke="#163b50" stroke-width="6"/>${Array.from({length:12},(_,i)=>{const a=(i+1)*Math.PI/6;return `<text x="${125+87*Math.sin(a)}" y="${131-87*Math.cos(a)}" text-anchor="middle" font-weight="900" fill="#153b50" font-size="17">${i+1}</text>`}).join('')}<line x1="125" y1="125" x2="${125+58*Math.sin(hh*Math.PI/180)}" y2="${125-58*Math.cos(hh*Math.PI/180)}" stroke="#153b50" stroke-width="9" stroke-linecap="round"/><line x1="125" y1="125" x2="${125+83*Math.sin(mm*Math.PI/180)}" y2="${125-83*Math.cos(mm*Math.PI/180)}" stroke="#dd795c" stroke-width="5" stroke-linecap="round"/><circle cx="125" cy="125" r="7" fill="#153b50"/></svg><div><div class="big-result">Start ${clockFormat(s.clockH*60+m)}</div><p>Add <b>${s.clockPlus}</b> minutes = ${Math.floor(s.clockPlus/60)} hours and ${s.clockPlus%60} minutes.</p><div class="big-result" style="color:var(--teal);margin-top:15px">Finish ${clockFormat(finish)}</div><p class="small muted">24-hour time, including overnight.</p></div></div>`}
if(labId==='shape'){const info={triangle:'2D polygon • 3 sides • 3 vertices • interior angles add to 180°.',square:'2D quadrilateral • 4 equal sides • 4 right angles • 4 lines of symmetry.',hexagon:'2D polygon • 6 sides • a regular hexagon has 6 equal angles and sides.',circle:'2D curved shape • no straight sides and no vertices.',cube:'3D solid • 6 square faces • 12 edges • 8 vertices.',cylinder:'3D solid • 2 circular flat faces and 1 curved surface.'};out=`<div class="row" style="justify-content:center"><div style="width:220px">${shapeSVG(s.shape)}</div><div style="flex:1;min-width:210px"><h3>${s.shape[0].toUpperCase()+s.shape.slice(1)}</h3><p style="margin-top:9px">${info[s.shape]}</p></div></div>`}
if(labId==='data'){const d=[['Football',9],['Rugby',14],['Golf',7],['Tennis',10]],max=16;out=`<div class="grid2" style="align-items:center"><div>${d.map(([l,n])=>`<div style="display:grid;grid-template-columns:78px 1fr 27px;align-items:center;gap:10px;margin:10px 0"><b class="small">${l}</b><button aria-label="${l}: ${n} votes" onclick="toast('${l}: ${n} votes')" style="background:#dcebe4;border:0;border-radius:8px;min-height:35px;text-align:left;padding:0"><span style="display:block;height:35px;width:${100*n/max}%;background:#168678;border-radius:8px"></span></button><b>${n}</b></div>`).join('')}</div><div><p><b>All votes:</b> 40</p><p><b>Most popular:</b> Rugby (14)</p><p><b>Least popular:</b> Golf (7)</p><p><b>Difference:</b> 7</p><p class="small muted">The bars all use the same scale.</p></div></div>`}
if(labId==='convert'){const a=conversion[s.convFrom],b=conversion[s.convTo];const compatible=a.k===b.k;const result=s.convValue*a.n/b.n;out=compatible?`<div class="big-result">${fmt(s.convValue)} ${s.convFrom} = ${fmt(Number(result.toFixed(8)))} ${s.convTo}</div><p class="small muted" style="margin-top:9px">Same quantity, different units. Think carefully about whether you multiply or divide.</p>`:`<div class="tip coral"><b>Choose matching kinds of units.</b><p>You cannot directly convert ${s.convFrom} (${a.k}) to ${s.convTo} (${b.k}). Pick two length, capacity or mass units.</p></div>`}
if(labId==='move'){const tx=30+s.moveX*40,ty=30+s.moveY*40;out=`<svg viewBox="0 0 420 350" role="img" aria-label="Interactive transformed shape">${Array.from({length:10},(_,i)=>`<line x1="${10+40*i}" y1="10" x2="${10+40*i}" y2="330" stroke="#c6ddd4"/><line x1="10" y1="${10+40*i}" x2="410" y2="${10+40*i}" stroke="#c6ddd4"/>`).join('')}<g transform="translate(${tx},${ty}) rotate(${s.moveAngle}) scale(${s.moveMirror?-1:1},1)"><polygon points="0,-22 23,20 -22,20" fill="#168678" stroke="#153b50" stroke-width="3"/><circle cx="-8" cy="10" r="4" fill="#ffc963"/></g></svg><p><b>Slide:</b> ${s.moveX} step(s) right and ${s.moveY} step(s) down. <b>Turn:</b> ${s.moveAngle}°. <b>Mirror:</b> ${s.moveMirror?'flipped':'normal'}.</p>`}dst.innerHTML=out}
function startQuiz(){quizIndex=0;quizAnswered=false;quizCorrect=0;quizSet=bank[activeQuiz].slice(0,8)}
function quizPage(){const t=topicById(activeQuiz);return`<div class="section-head"><div><span class="eyebrow">Short maths missions</span><h2>🎯 Quiz training</h2><p>Eight questions, worked feedback and star rewards for new correct answers.</p></div></div><div class="filterbar">${topics.map(t=>`<button class="${activeQuiz===t.id?'active':''}" onclick="activeQuiz='${t.id}';startQuiz();render()">${t.icon} ${t.name}</button>`).join('')}</div><section class="card quizpanel" id="quizContent"><h2>${t.icon} ${t.name}</h2><div id="qMount"></div></section>`}
function qUI(q,name){if(q.type==='choice'){let opts=[q.a,...q.o];opts=[...new Set(opts)];return `<div class="choices">${opts.map((val,i)=>`<button class="choice" data-val="${esc(val)}" onclick="answerQuestion('${name}',${i})"><span class="letter">${'ABCD'[i]}</span><span>${esc(val)}</span></button>`).join('')}</div>`}return `<div class="control"><label for="numericAns">Your answer (number only)</label><input id="numericAns" class="field number" inputmode="decimal" autocomplete="off" placeholder="Type your answer" onkeydown="if(event.key==='Enter')answerQuestion('${name}')"></div><button class="btn teal" id="checkBtn" onclick="answerQuestion('${name}')">Check my answer</button>`}
function answerMatch(val,answer){if(typeof answer==='number'){const f=Number(String(val).replace(/\s/g,'').replace(',','.'));return Number.isFinite(f)&&Math.abs(f-answer)<1e-6}return String(val).trim().toLowerCase()===String(answer).trim().toLowerCase()}
function showQuizQuestion(){const m=$('qMount');if(!m)return;const q=quizSet[quizIndex];if(!q){const t=topicById(activeQuiz),p=getProfile();p.best[activeQuiz]=Math.max(p.best[activeQuiz]||0,quizCorrect);store();if(quizCorrect>=7)award('master-'+activeQuiz,5,'Mission mastery!');m.innerHTML=`<div style="text-align:center;padding:30px 0"><div style="font-size:4rem">${quizCorrect>=7?'🏆':'🌟'}</div><div class="eyebrow">Mission complete</div><h2>${quizCorrect} out of 8 correct</h2><p style="margin:12px 0 24px">${quizCorrect>=7?'Excellent work! You have mastered this set.':'Nice effort. Read the explanations, practise the tricky parts and try again.'}</p><div class="row" style="justify-content:center"><button class="btn teal" onclick="startQuiz();render()">Try again</button><button class="btn ghost" onclick="goto('lesson','${activeQuiz}')">Review lesson</button><button class="btn gold" onclick="goto('exam')">Exam practice</button></div></div>`;return}quizAnswered=false;m.innerHTML=`<div class="quiztop"><span class="tag">Question ${quizIndex+1} / ${quizSet.length}</span><b>⭐ ${quizCorrect} correct so far</b></div><div class="progress"><span style="width:${quizIndex/quizSet.length*100}%"></span></div><div class="question">${esc(q.p)}</div>${qUI(q,'quiz')}<div id="qFeedback"></div>`}
function answerQuestion(context,index){if(context==='quiz'){if(quizAnswered)return;const q=quizSet[quizIndex];let v=q.type==='choice'?[q.a,...q.o][index]:$('numericAns')?.value;if(v==null||v==='')return toast('Try an answer first.');quizAnswered=true;const ok=answerMatch(v,q.a);if(ok){quizCorrect++;const p=getProfile(),key=activeQuiz+'-'+quizIndex;if(!p.quiz[key]){p.quiz[key]=true;store();toast('⭐ +2 stars! Correct answer.')}}document.querySelectorAll('#qMount .choice').forEach(b=>{b.disabled=true;if(b.dataset.val===String(q.a))b.classList.add('correct');if(b.dataset.val===String(v)&&!ok)b.classList.add('wrong')});if($('numericAns'))$('numericAns').disabled=true;if($('checkBtn'))$('checkBtn').disabled=true;$('qFeedback').innerHTML=`<div class="feedback ${ok?'':'bad'}"><b>${ok?'✅ Correct!':'💡 Keep practising!'}</b>${ok?'Great reasoning!':'Correct answer: <b>'+fmt(q.a)+'</b>.'}<p>${esc(q.e)}</p></div><div class="answer-footer"><span class="muted small">${quizCorrect} / ${quizIndex+1} correct</span><button class="btn primary" onclick="quizIndex++;showQuizQuestion()">${quizIndex+1===quizSet.length?'See my result':'Next question →'}</button></div>`;updateTop();return}
if(context==='exam')answerExam(index)}
function flashPage(){let pool=allTerms.filter(t=>flashFilter==='all'||t.topic===flashFilter);if(!pool.length)pool=allTerms;flashIndex=Math.max(0,Math.min(flashIndex,pool.length-1));const card=pool[flashIndex];return`<div class="section-head"><div><span class="eyebrow">Quick memory cards</span><h2>🃏 Flip & learn</h2><p>Tap the big card to flip it. You can revisit any word whenever you like.</p></div></div><div class="filterbar"><button class="${flashFilter==='all'?'active':''}" onclick="flashFilter='all';flashIndex=0;flashFlip=false;render()">All words</button>${topics.map(t=>`<button class="${flashFilter===t.id?'active':''}" onclick="flashFilter='${t.id}';flashIndex=0;flashFlip=false;render()">${t.icon} ${t.name}</button>`).join('')}</div><div style="max-width:820px;margin:auto"><button class="flashcard ${flashFlip?'flipped':''}" onclick="flashFlip=!flashFlip;render()"><small>${flashFlip?'ANSWER':'MATHS WORD'} · ${esc(topicById(card.topic).name)}</small><div class="flashbig">${esc(flashFlip?card.d:card.w)}</div><small>Tap to ${flashFlip?'see the term':'flip & reveal'}</small></button><div class="answer-footer"><button class="btn ghost" onclick="flashIndex=(flashIndex-1+${pool.length})%${pool.length};flashFlip=false;render()">← Previous</button><b class="muted">${flashIndex+1} / ${pool.length}</b><button class="btn teal" onclick="flashIndex=(flashIndex+1)%${pool.length};flashFlip=false;render()">Next →</button></div></div>`}
function wordPage(){const p=getProfile();let pool=allTerms.filter(x=>(wordFilter==='all'||x.topic===wordFilter)&&(!wordSearch||(x.w+' '+x.d).toLowerCase().includes(wordSearch.toLowerCase())));return `<div class="section-head"><div><span class="eyebrow">Tap-to-reveal dictionary</span><h2>📚 Maths word bank</h2><p>Open a word, say the definition in your own words, and mark it mastered to earn ⭐ one star.</p></div></div><div class="card" style="padding:18px;margin-bottom:17px"><div class="row" style="justify-content:space-between"><b>${Object.keys(p?.words||{}).length} / ${allTerms.length} words mastered</b><span class="tag orange">⭐ +1 per new word</span></div><div class="progress" style="margin-top:11px"><span style="width:${100*Object.keys(p?.words||{}).length/allTerms.length}%"></span></div></div><input class="field" placeholder="🔎 Search terms or definitions" value="${esc(wordSearch)}" oninput="wordSearch=this.value;refreshWords()" aria-label="Search words" id="wordSearchInput" style="margin-bottom:15px"><div class="filterbar" id="wordFilters">${wordFilters()}</div><div id="wordResults">${wordResults(pool)}</div>`}
function wordFilters(){return`<button class="${wordFilter==='all'?'active':''}" onclick="wordFilter='all';refreshWords()">All</button>${topics.map(t=>`<button class="${wordFilter===t.id?'active':''}" onclick="wordFilter='${t.id}';refreshWords()">${t.icon} ${t.name}</button>`).join('')}`}
function wordResults(pool){const p=getProfile();if(!pool.length)return'<p class="muted">No matching words. Try a different search.</p>';return `<div class="grid2">${pool.map(x=>`<details class="card gloss"><summary><span>📖 ${esc(x.w)}</span><span>${p?.words[x.id]?'✅':'⌄'}</span></summary><div class="definition"><p>${esc(x.d)}</p><button class="btn sm ${p?.words[x.id]?'soft':'gold'}" onclick="masterWord('${x.id}')">${p?.words[x.id]?'✅ Mastered':'⭐ I can explain this (+1)'}</button></div></details>`).join('')}</div>`}
function refreshWords(){const ip=$('wordSearchInput');if(ip)wordSearch=ip.value;const pool=allTerms.filter(x=>(wordFilter==='all'||x.topic===wordFilter)&&(!wordSearch||(x.w+' '+x.d).toLowerCase().includes(wordSearch.toLowerCase())));$('wordFilters').innerHTML=wordFilters();$('wordResults').innerHTML=wordResults(pool)}
function masterWord(id){const p=getProfile();if(!p.words[id]){p.words[id]=true;store();toast('⭐ +1 star! Word mastered.')}updateTop();refreshWords()}
// Simulated papers are original questions, not digital replicas of the supplied copyrighted tests.
const papers=[{id:'paper1',title:'Paper 1 · Numbers, operations & patterns',desc:'Whole numbers, number sentences, calculations, fractions and patterns.',topics:['whole','addition','multiply','fractions','sentences','patterns'],icon:'🔢'},{id:'paper2',title:'Paper 2 · Space, measurement & data',desc:'2D/3D, transformations, measurements, time and data handling.',topics:['shapes','transform','length','area','time','capacity','mass','data'],icon:'📐'},{id:'mixed',title:'Mixed November rehearsal',desc:'A 50-mark review across every topic on the school examination guide.',topics:topics.map(t=>t.id),icon:'🏆'}];
function makeExam(id){const config=papers.find(x=>x.id===id);const keys=config.topics;let result=[],i=0;while(result.length<25){const t=keys[i%keys.length];const list=bank[t];const nth=Math.floor(i/keys.length);result.push({...list[(nth*3+i)%list.length],topic:t});i++}examState={id,questions:result,pos:0,answers:Array(result.length).fill(null),correct:0,finished:false};render()}
function examPage(){if(!examState){const p=getProfile();return`<div class="section-head"><div><span class="eyebrow">Exam rehearsal • no calculator</span><h2>📝 Practice papers</h2><p>Original practice questions in the style and topic mix of the supplied November papers. Each simulated paper has 25 questions worth 2 marks each (50 marks). Answer first, then see your memo.</p></div></div><div class="grid3">${papers.map(paper=>`<section class="card exam-card"><span style="font-size:2.5rem">${paper.icon}</span><h3>${paper.title}</h3><p class="muted small" style="margin:10px 0 17px">${paper.desc}</p><p class="small"><b>25 questions · 50 marks</b></p><p class="small" style="margin:8px 0 17px"><b>Best:</b> ${p?.exams[paper.id]!=null?p.exams[paper.id]+'/50':'Not attempted yet'}</p><button class="btn teal" onclick="makeExam('${paper.id}')">Start paper →</button></section>`).join('')}</div><div class="tip section-gap"><b>Important:</b> These are revision simulations, not your school's official papers. Work on paper where you need columns, diagrams or written methods. The app marks final answers and shows worked feedback after you finish.</div>`}if(examState.finished)return examResults();return `<div class="section-head"><div><span class="eyebrow">${papers.find(x=>x.id===examState.id).title}</span><h2>📝 Exam rehearsal</h2><p>25 questions · 2 marks each · Work without a calculator.</p></div><button class="btn ghost sm" onclick="if(confirm('Leave this practice paper? Your unfinished answers will be lost.')){examState=null;render()}">Exit paper</button></div><div class="card quizpanel"><div id="examMount"></div></div>`}
function showExamQuestion(){const m=$('examMount');if(!m)return;const e=examState,q=e.questions[e.pos];if(!q){finishExam();return}m.innerHTML=`<div class="quiztop"><span class="tag">Question ${e.pos+1} / ${e.questions.length} · 2 marks</span><span class="muted small">${esc(topicById(q.topic).name)}</span></div><div class="progress"><span style="width:${100*e.pos/e.questions.length}%"></span></div><div class="question">${esc(q.p)}</div>${qUI(q,'exam')}<div class="answer-footer"><span class="muted small">The memo appears at the end.</span><button class="btn ghost" onclick="answerExam(null,true)">Skip question →</button></div>`}
function answerExam(index,skip=false){const e=examState;if(!e||e.finished)return;const q=e.questions[e.pos];let v=skip?null:q.type==='choice'?[q.a,...q.o][index]:$('numericAns')?.value;if(!skip&&(v===null||v===''))return toast('Type or choose an answer, or skip the question.');e.answers[e.pos]=v;e.pos++;if(e.pos>=e.questions.length)finishExam();else showExamQuestion()}
function finishExam(){const e=examState;e.correct=e.questions.filter((q,i)=>answerMatch(e.answers[i],q.a)).length;e.finished=true;const p=getProfile(),marks=2*e.correct;p.exams[e.id]=Math.max(p.exams[e.id]||0,marks);store();if(marks>=40)award('exam-'+e.id,10,'Strong exam result!');render()}
function examResults(){const e=examState,marks=2*e.correct;return`<div class="section-head"><div><div class="eyebrow">Practice paper finished</div><h2>${marks>=40?'🏆 Great work!':'🌟 Mission progress!'}</h2><p>Review what you missed, then practise that topic again.</p></div></div><div class="card" style="padding:28px;text-align:center"><div style="font-size:4rem">${marks>=40?'🏅':'🧠'}</div><div style="font-size:3rem;font-weight:950">${marks} / 50</div><h3>${Math.round(marks/50*100)}%</h3><p class="muted" style="margin-top:7px">${e.correct} questions correct · ${e.questions.length-e.correct} to review</p><div class="row" style="justify-content:center;margin-top:19px"><button class="btn teal" onclick="makeExam('${e.id}')">Try another paper</button><button class="btn ghost" onclick="examState=null;render()">Other papers</button></div></div><div class="section-head section-gap"><div><h2>Your marking memo</h2><p>Each question shows your answer and why the correct answer works.</p></div></div><div class="card" style="padding:12px 24px">${e.questions.map((q,i)=>{const ok=answerMatch(e.answers[i],q.a);return`<div class="exam-result-item"><div class="row"><span class="tag ${ok?'':'orange'}">${ok?'✅ 2/2':'✏️ 0/2'} marks</span><span class="muted small">${esc(topicById(q.topic).name)}</span></div><b>${i+1}. ${esc(q.p)}</b><p class="small">Your answer: <b>${e.answers[i]!==null?esc(fmt(e.answers[i])):'Skipped'}</b> · Correct: <b>${esc(fmt(q.a))}</b></p><p class="muted small">${esc(q.e)}</p>${!ok?`<button class="btn sm soft" style="margin-top:8px" onclick="goto('lesson','${q.topic}')">Study this topic</button>`:''}</div>`}).join('')}</div>`}
function showProfiles(){const options=Object.entries(saved.profiles).map(([id,p])=>`<button class="btn ghost" style="justify-content:space-between;width:100%;margin-top:8px" onclick="selectProfile('${esc(id)}')">👤 ${esc(p.name)} <span class="muted small">⭐ ${score(p)}</span></button>`).join('');$('overlay').innerHTML=`<div class="modalback" role="dialog" aria-modal="true" aria-label="Choose learner"><div class="card modal"><div class="eyebrow">Welcome, explorer!</div><h2>Who is learning today?</h2><p class="muted">Everyone can keep their own stars and completed lessons on this device.</p>${options}<div class="control" style="margin-top:18px"><label for="newLearner">Add a learner</label><input class="field" id="newLearner" maxlength="30" placeholder="Type your first name" onkeydown="if(event.key==='Enter')createProfile()"></div><button class="btn teal" style="width:100%;margin-top:6px" onclick="createProfile()">🚀 Start my maths mission</button>${getProfile()?'<button class="btn ghost sm" style="width:100%;margin-top:9px" onclick="closeProfiles()">Close</button>':''}<p class="tiny muted" style="margin-top:15px">Progress is saved locally in this browser. Clearing browser data may erase it. No account or internet needed.</p></div></div>`;setTimeout(()=>$('newLearner')?.focus(),10)}
function closeProfiles(){$('overlay').innerHTML=''}
function selectProfile(id){if(!saved.profiles[id])return;saved.current=id;store();closeProfiles();goto('home')}
function createProfile(){const input=$('newLearner'),name=input?.value.trim();if(!name)return toast('Please type a first name.');const id='u'+Date.now()+'_'+Object.keys(saved.profiles).length;saved.profiles[id]=emptyProfile(name.slice(0,30));saved.current=id;store();closeProfiles();goto('home');toast('Welcome aboard, '+name+'! 🚀')}
render();if(!getProfile())showProfiles();
</script></body></html>
